[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiva-framework"
version = "0.1.0"
description = "AI-driven validation and automation framework for system, performance, and reliability testing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yan Ren"}]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ai = ["openai>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
aiva = "aiva.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

